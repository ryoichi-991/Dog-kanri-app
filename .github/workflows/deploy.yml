name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER_PRODUCTION }}
          port: ${{ secrets.SSH_PORT_PRODUCTION }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            APP_DIR="$HOME/apps/Dog-kanri-app"
            PREV_SHA="$(cd "$APP_DIR" 2>/dev/null && git rev-parse HEAD 2>/dev/null || true)"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/ryoichi-991/Dog-kanri-app.git"
              git fetch origin main
              git checkout -B main origin/main
            else
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/ryoichi-991/Dog-kanri-app.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            WEB_PORT=8091 docker compose build --pull --no-cache web
            WEB_PORT=8091 docker compose up -d --force-recreate --remove-orphans
            bash deploy/configure-nginx-upload.sh

            HTTP_CODE=000
            for attempt in 1 2 3 4 5 6; do
              sleep 5
              HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8091/health 2>/dev/null || echo 000)
              case "$HTTP_CODE" in 2*|3*|4*) break;; esac
            done

            case "$HTTP_CODE" in
              2*|3*|4*) echo "[DEPLOY] OK HTTP $HTTP_CODE" ;;
              *)
                WEB_PORT=8091 docker compose logs --no-color --tail=200 web || true
                if [ -n "$PREV_SHA" ]; then
                  git checkout -B main "$PREV_SHA"
                  WEB_PORT=8091 docker compose up -d --force-recreate --build web
                fi
                exit 1
                ;;
            esac
