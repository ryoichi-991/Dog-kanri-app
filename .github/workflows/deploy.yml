name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run production quality checks
        run: |
          python -m py_compile server.py
          python -m unittest discover -s tests -v
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER_PRODUCTION }}
          port: ${{ secrets.SSH_PORT_PRODUCTION }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: GITHUB_TOKEN
          script: |
            set -e
            APP_DIR="$HOME/apps/Dog-kanri-app"
            PREV_SHA="$(cd "$APP_DIR" 2>/dev/null && git rev-parse HEAD 2>/dev/null || true)"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/ryoichi-991/Dog-kanri-app.git"
              git fetch origin main
              git checkout -B main origin/main
            else
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch main "https://x-access-token:${GITHUB_TOKEN}@github.com/ryoichi-991/Dog-kanri-app.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            touch .env
            chmod 600 .env
            if ! grep -q '^LINE_CREDENTIALS_KEY=' .env; then
              LINE_ENCRYPTION_KEY="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '\n')"
              printf '\nLINE_CREDENTIALS_KEY=%s\n' "$LINE_ENCRYPTION_KEY" >> .env
              echo "[LINE] 認証情報の暗号鍵を生成しました"
            fi

            WEB_PORT=8091 docker compose build --pull --no-cache web
            WEB_PORT=8091 docker compose up -d --force-recreate --remove-orphans
            bash deploy/configure-nginx-upload.sh

            HTTP_CODE=000
            for attempt in 1 2 3 4 5 6; do
              sleep 5
              HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8091/health 2>/dev/null || echo 000)
              case "$HTTP_CODE" in 2*|3*|4*) break;; esac
            done

            if echo "$HTTP_CODE" | grep -Eq '^[234]'; then
              LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8091/login || echo 000)
              API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8091/api/v1/me || echo 000)
              WORKER_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8091/family-push-worker.js || echo 000)
              HEALTH_BODY=$(curl -fsS --max-time 10 http://127.0.0.1:8091/health || true)
              OPENAPI=$(curl -fsS --max-time 10 http://127.0.0.1:8091/openapi.json || true)
              if [ "$LOGIN_CODE" != "200" ] || [ "$API_CODE" != "401" ] || [ "$WORKER_CODE" != "200" ] \
                 || ! echo "$OPENAPI" | grep -q 'family/backups/download' \
                 || ! echo "$OPENAPI" | grep -q 'family/backups/verify' \
                 || ! echo "$OPENAPI" | grep -q 'admin/operations' \
                 || ! echo "$OPENAPI" | grep -q 'api/v1/auth/token' \
                 || ! echo "$HEALTH_BODY" | grep -q '"push_ready":true'; then
                echo "[SMOKE] FAILED login=$LOGIN_CODE api=$API_CODE worker=$WORKER_CODE"
                HTTP_CODE=000
              else
                echo "[SMOKE] OK login=$LOGIN_CODE api=$API_CODE worker=$WORKER_CODE"
              fi
            fi

            case "$HTTP_CODE" in
              2*|3*|4*) echo "[DEPLOY] OK HTTP $HTTP_CODE" ;;
              *)
                WEB_PORT=8091 docker compose logs --no-color --tail=200 web || true
                if [ -n "$PREV_SHA" ]; then
                  git checkout -B main "$PREV_SHA"
                  WEB_PORT=8091 docker compose up -d --force-recreate --build web
                fi
                exit 1
                ;;
            esac
